description = "Implement or fix mSpace inbound webhooks"
prompt = "Work on mSpace callbacks: {{args}}. Run `node tools/mspace.mjs list --direction=inbound` and `node tools/mspace.mjs show <id>` for each. There are five configured URLs: Message Receiving URL, Delivery Report URL, USSD Connection URL, Subscription Notification URL and Charging Notification URL. Every handler must return HTTP 200 with {\"statusCode\":\"S1000\",\"statusDetail\":\"Success\"}, acknowledge before doing work, deduplicate on the documented key, validate the schema, and verify applicationId where the payload carries it — an unparseable response comes back as E1607. The subscription notification payload is not separately published, so accept the documented subscription/notify vocabulary and tolerate anything else. Test with ./scripts/test-callbacks.sh."
