description = "Work on an mSpace integration (SMS, USSD, Subscription, OTP, CaaS, LBS)"
prompt = "Use the mSpace skill for this task. mSpace is Mobitel's Sri Lankan application platform. Before writing code, query the contract rather than recalling it: run `node tools/mspace.mjs list` and `node tools/mspace.mjs show <id>` for each service involved. Non-negotiable: credentials come from environment variables and are never in source, a client bundle, or a log; mSpace is called from the backend only; branch on statusCode because HTTP 200 does not mean success, and S1000 is not the only success code (P1003 on CaaS OTP generation, S1001 on Subscriber List, statusDescription instead of statusDetail on CaaS OTP verification); a charge is three exchanges and is idempotent on externalTrxId. Write the integration in whatever language this project already uses — templates/ covers TypeScript/Node, Python, Java, Go, PHP and C#, and references/12-any-stack.md specifies the same integration for any other stack. Task: {{args}}"
