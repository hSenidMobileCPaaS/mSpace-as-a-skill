description = "Review mSpace integration code for money, credential and compliance bugs"
prompt = "Review this project's mSpace integration using the mspace-review skill. Run `node tools/mspace.mjs practices` and check every one against the code. Pay particular attention to code that hard-codes S1000 as the only success, reads only statusDetail, or treats POST /caas/direct/debit as a complete charge. Report findings with file:line, most severe first, each with the evidence and the specific fix. Finish with a plain verdict on whether this is safe to put in front of real subscribers."
