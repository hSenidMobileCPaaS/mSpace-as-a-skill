description = "Build or debug an mAI Tokens (mSpace AI gateway) integration"
prompt = "Work on this mAI Tokens task using the mspace-mai skill: {{args}}. Run `node tools/mspace.mjs mai` for the contract and `node tools/mspace.mjs show mai-chat-completions` or `mai-image-generation` for the exact parameters; read references/15-mai-tokens.md. mAI Tokens is NOT the telco platform: it is on https://maitokens.mspace.lk/api, the key goes in an Authorization header verbatim with no Bearer prefix, failures are real HTTP status codes with an error object rather than an S1000 envelope, and it needs its own client separate from the telco one. Use the exact model ids from `node tools/mspace.mjs mai models`, cap every call with max_completion_tokens, never let an MSISDN or subscriberId reach a prompt, check finish_reason before using the content, and never call a model inside a callback response path."
