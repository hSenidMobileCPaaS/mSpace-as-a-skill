description = "Diagnose a failing mSpace call or callback"
prompt = "Diagnose this mSpace problem: {{args}}. Run `node tools/mspace.mjs diagnose` with the symptom, and `node tools/mspace.mjs code <statusCode>` if there is a code. If you can get hold of the actual bodies, they answer this faster than any guess: `node tools/mspace.mjs validate <id> '<the body that was sent>'` checks the request against the contract — including string fields serialised as JSON numbers, which is the most common silent corruption (amount, otp, referenceNo, externalTrxId, action) — and `node tools/mspace.mjs response <id> '<the body that came back>'` says whether that code is a success for that endpoint and what to do with it next. Remember mSpace returns HTTP 200 for failures, so first confirm the code is reading statusCode at all — then confirm it is not rejecting a documented success (P1003 on CaaS OTP generation, S1001 on Subscriber List, statusDescription rather than statusDetail on CaaS OTP verification). Give the most likely cause and the specific fix."
