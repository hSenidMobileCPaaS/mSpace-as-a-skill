description = "Scaffold a new mSpace integration — config, client, types, callbacks"
prompt = "Scaffold an mSpace integration for: {{args}}. Follow the mspace-scaffold skill. Write it in this project's existing language and framework — mSpace is JSON over HTTPS and templates/ ships working code for TypeScript/Node, Python, Java, Go, PHP and C#, with references/12-any-stack.md covering anything else. Never add a second runtime for this. Build in order: (1) .env plus .env.example plus a config module that validates at startup, so no credential can land in source; (2) one client with a single post() helper that injects credentials, sets a timeout, and takes the success set as a parameter (S1000 by default, P1003 for CaaS OTP generation, S1000 and S1001 for Subscriber List); (3) the callback handlers, which acknowledge before doing work and deduplicate. If CaaS is in scope, model charging as a persisted state machine across three exchanges keyed by externalTrxId. Get every contract from `node tools/mspace.mjs show <id>`."
